name: Web Application CI-CD

on:
  push:
    branches:
      - digitalocean-setup
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webapp/requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall webapp

      - name: Test health endpoint
        working-directory: webapp
        run: |
          python -c "from app import app; client = app.test_client(); response = client.get('/health'); assert response.status_code == 200; assert response.get_json() == {'status': 'ok'}"

  deploy:
    name: Deploy to DigitalOcean
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: self-hosted

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Copy web application
        run: |
          rsync -av --delete \
            --exclude '.venv/' \
            --exclude '.env' \
            webapp/ /opt/ccs-web/

      - name: Install production dependencies
        run: |
          python3 -m venv /opt/ccs-web/.venv
          /opt/ccs-web/.venv/bin/pip install --upgrade pip
          /opt/ccs-web/.venv/bin/pip install -r /opt/ccs-web/requirements.txt

      - name: Restart web application
        run: |
          sudo /usr/bin/systemctl restart ccs-web.service

      - name: Verify deployment
        run: |
          sleep 2
          curl --fail http://127.0.0.1:8000/health