name: terraform-aws
on:
  pull_request:
    paths: ["aws/**"]
  push:
    branches: [main]
    paths: ["aws/**"]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: eu-north-1
  TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - name: Check credential format
        run: |
          echo "ID length: ${#AWS_ACCESS_KEY_ID}"
          echo "Secret length: ${#AWS_SECRET_ACCESS_KEY}"
          [[ "$AWS_ACCESS_KEY_ID" =~ ^AKIA[A-Z0-9]{16}$ ]] && echo "ID format: OK" || echo "ID format: BAD"
          [[ "$AWS_SECRET_ACCESS_KEY" =~ ^[A-Za-z0-9/+=]{40}$ ]] && echo "Secret format: OK" || echo "Secret format: BAD" 
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan
      - name: Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan